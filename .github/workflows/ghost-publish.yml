name: Publish blog posts to Ghost

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'publish.js'
      - 'lib.js'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Publish to Ghost
        env:
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_URL: https://blog.heymedy.com
        run: npm run publish

      - name: Commit frontmatter updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain posts/)" ]; then
            git add posts/
            git commit -m "chore: sync post IDs from Ghost [skip ci]"
            git push
          fi
